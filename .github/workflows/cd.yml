name: CD - Deploy to AKS

on:
  workflow_run:
    workflows:
      - "CI - Build and Push Image"
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudops-dev-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: incident-app
  HELM_RELEASE: incident-app

jobs:
  deploy:
    name: Deploy to AKS with Helm

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout the exact commit successfully built by CI
      # ---------------------------------------------------------
      - name: Checkout exact CI commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ---------------------------------------------------------
      # 2. Login to Azure using GitHub OIDC
      # ---------------------------------------------------------
      - name: Login to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------------------------
      # 3. Install kubectl
      # ---------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v5

      # ---------------------------------------------------------
      # 4. Install Helm
      # ---------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v5

      # ---------------------------------------------------------
      # 5. Connect GitHub Actions runner to AKS
      # ---------------------------------------------------------
      - name: Connect to AKS
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      # ---------------------------------------------------------
      # 6. Verify AKS connection
      # ---------------------------------------------------------
      - name: Verify AKS connection
        run: |
          echo "Checking AKS nodes..."
          kubectl get nodes

          echo ""
          echo "Checking namespace..."
          kubectl get namespace ${{ vars.K8S_NAMESPACE }}

      # ---------------------------------------------------------
      # 7. Validate required repository variables
      # ---------------------------------------------------------
      - name: Validate deployment configuration
        run: |
          if [ -z "${{ vars.WORKLOAD_IDENTITY_CLIENT_ID }}" ]; then
            echo "WORKLOAD_IDENTITY_CLIENT_ID is missing."
            exit 1
          fi

          if [ -z "${{ vars.KEY_VAULT_URI }}" ]; then
            echo "KEY_VAULT_URI is missing."
            exit 1
          fi

          if [ -z "${{ vars.ACR_NAME }}" ]; then
            echo "ACR_NAME is missing."
            exit 1
          fi

          echo "Required deployment variables are configured."

      # ---------------------------------------------------------
      # 8. Use the exact Git SHA produced by CI
      # ---------------------------------------------------------
      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # 9. Verify that CI pushed the image into ACR
      # ---------------------------------------------------------
      - name: Verify image exists in ACR
        run: |
          echo "Checking image:"
          echo "${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

          az acr repository show \
            --name ${{ vars.ACR_NAME }} \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output table

      # ---------------------------------------------------------
      # 10. Validate Helm chart
      # ---------------------------------------------------------
      - name: Lint Helm chart
        run: |
          helm lint ./helm/incident-app

      # ---------------------------------------------------------
      # 11. Deploy application to AKS using Helm
      # ---------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install "${HELM_RELEASE}" \
            ./helm/incident-app \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            --set-string image.repository="${{ vars.ACR_NAME }}.azurecr.io/${IMAGE_NAME}" \
            --set-string image.tag="${IMAGE_TAG}" \
            --set-string workloadIdentity.clientId="${{ vars.WORKLOAD_IDENTITY_CLIENT_ID }}" \
            --set-string keyVault.uri="${{ vars.KEY_VAULT_URI }}" \
            --rollback-on-failure \
            --wait \
            --timeout 5m

      # ---------------------------------------------------------
      # 12. Verify Kubernetes rollout
      # ---------------------------------------------------------
      - name: Verify Kubernetes rollout
        run: |
          kubectl rollout status deployment/incident-app \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            --timeout=180s

      # ---------------------------------------------------------
      # 13. Show exact image deployed to AKS
      # ---------------------------------------------------------
      - name: Show deployed image
        run: |
          echo "Image running in AKS:"

          kubectl get deployment incident-app \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo ""

      # ---------------------------------------------------------
      # 14. Verify Workload Identity ServiceAccount
      # ---------------------------------------------------------
      - name: Verify Workload Identity
        run: |
          echo "ServiceAccount:"
          kubectl get serviceaccount incident-app \
            --namespace ${{ vars.K8S_NAMESPACE }}

          echo ""
          echo "Managed Identity client ID annotation:"

          kubectl get serviceaccount incident-app \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            -o jsonpath='{.metadata.annotations.azure\.workload\.identity/client-id}'

          echo ""

      # ---------------------------------------------------------
      # 15. Verify Key Vault URI passed to deployment
      # ---------------------------------------------------------
      - name: Verify Key Vault configuration
        run: |
          echo "KEY_VAULT_URI configured in deployment:"

          kubectl get deployment incident-app \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KEY_VAULT_URI")].value}'

          echo ""

      # ---------------------------------------------------------
      # 16. Show running pods
      # ---------------------------------------------------------
      - name: Show pods
        run: |
          kubectl get pods \
            --namespace ${{ vars.K8S_NAMESPACE }} \
            -o wide

      # ---------------------------------------------------------
      # 17. Show Helm release and history
      # ---------------------------------------------------------
      - name: Show Helm release
        run: |
          helm list \
            --namespace ${{ vars.K8S_NAMESPACE }}

          echo ""

          helm history "${HELM_RELEASE}" \
            --namespace ${{ vars.K8S_NAMESPACE }}