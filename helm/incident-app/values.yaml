replicaCount: 2

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

environment:
  name: dev

probes:
  liveness:
    path: /health
    initialDelaySeconds: 15
    periodSeconds: 20

  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
